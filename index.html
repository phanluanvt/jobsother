<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JobsOther | Jobs In Your Area</title>
  <meta name="description" content="Search jobs in your area with JobsOther.">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#fff;
      color:#333;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }
    .page{
      flex:1;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:72px 20px 40px;
    }
    .search-area{
      width:100%;
      max-width:980px;
      text-align:center;
    }
    .brand{
      display:inline-block;
      font-size:31px;
      font-weight:700;
      letter-spacing:-1px;
      color:#2b2b2b;
      margin-bottom:44px;
      text-decoration:none;
    }
    .brand strong{color:#e67817}
    h1{
      margin:0 0 12px;
      font-size:34px;
      line-height:1.2;
      font-weight:500;
      color:#444;
    }
    .subtitle{
      margin:0 0 32px;
      font-size:18px;
      color:#666;
      font-weight:400;
    }
    .search-form{
      display:flex;
      justify-content:center;
      align-items:stretch;
      gap:10px;
      max-width:900px;
      margin:0 auto;
    }
    .search-form input{
      height:52px;
      border:1px solid #cfcfcf;
      border-radius:3px;
      padding:0 15px;
      font-size:16px;
      outline:none;
      background:#fff;
      color:#333;
    }
    .search-form input:focus{
      border-color:#999;
      box-shadow:0 0 0 1px #999;
    }
    .keyword{flex:1.15}
    .location{flex:1}
    .search-form button{
      min-width:140px;
      border:0;
      border-radius:3px;
      background:#ef7d19;
      color:#fff;
      font-size:17px;
      font-weight:700;
      cursor:pointer;
      padding:0 25px;
    }
    .search-form button:hover{background:#d96d10}
    .popular{
      margin-top:22px;
      font-size:13px;
      color:#888;
    }
    .popular a{color:#777;text-decoration:none}
    .popular a:hover{text-decoration:underline}
    footer{
      border-top:1px solid #e3e3e3;
      background:#fafafa;
      padding:23px 20px 27px;
      text-align:center;
      font-size:13px;
      color:#777;
    }
    .footer-links{
      margin-bottom:14px;
      line-height:2;
    }
    .footer-links a{
      color:#666;
      text-decoration:none;
      margin:0 7px;
      white-space:nowrap;
    }
    .footer-links a:hover{text-decoration:underline}
    .copyright{color:#999}
    @media(max-width:720px){
      .page{padding-top:48px}
      .brand{margin-bottom:34px}
      h1{font-size:29px}
      .subtitle{font-size:16px}
      .search-form{display:block}
      .search-form input,
      .search-form button{
        width:100%;
        height:52px;
        margin-bottom:10px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="search-area">
      <a class="brand" href="/">Jobs<strong>Other</strong></a>
      <h1>Search for Jobs</h1>
      <p class="subtitle">Search all jobs in your area</p>

      <form class="search-form" id="jobSearch">
        <input class="keyword" id="keyword" name="q" type="text" placeholder="Job Title, Keywords..." autocomplete="off">
        <input class="location" id="location" name="location" type="text" placeholder="Enter location/area/postcode..." autocomplete="off">
        <button type="submit">Search Jobs</button>
      </form>

      <div class="popular">
        Popular searches:
        <a href="#" data-q="driver">Driver</a> ·
        <a href="#" data-q="warehouse">Warehouse</a> ·
        <a href="#" data-q="customer service">Customer Service</a> ·
        <a href="#" data-q="remote">Remote</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-links">
      <a href="/job-alerts.html">Job Alerts</a> •
      <a href="/about.html">About Us</a> •
      <a href="/terms.html">Terms of Use</a> •
      <a href="/privacy.html">Privacy Policy</a> •
      <a href="/cookie.html">Cookie Policy</a> •
      <a href="/email-policy.html">E-mail Policy</a> •
      <a href="/contact.html">Contact Us</a> •
      <a href="/post-a-job.html">Post a Job</a>
    </div>
    <div class="copyright">Copyright © 2026 JobsOther. All Rights Reserved.</div>
  </footer>

  <script>
    function runSearch(){
      const q=document.getElementById('keyword').value.trim();
      const location=document.getElementById('location').value.trim();
      const params=new URLSearchParams();
      if(q) params.set('q',q);
      if(location) params.set('location',location);
      window.location.href='/jobs.html'+(params.toString()?'?'+params.toString():'');
    }

    document.getElementById('jobSearch').addEventListener('submit',function(e){
      e.preventDefault();
      runSearch();
    });

    document.querySelectorAll('[data-q]').forEach(function(link){
      link.addEventListener('click',function(e){
        e.preventDefault();
        document.getElementById('keyword').value=this.dataset.q;
        runSearch();
      });
    });
  </script>
</body>
</html>
