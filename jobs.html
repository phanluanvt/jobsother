<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Search | JobsOther</title>
<style>
:root{
  --orange:#f47a1f;--orange-dark:#dc6710;--ink:#202733;--muted:#667085;
  --line:#e5e7eb;--soft:#f6f7f9;--white:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--soft)}
a{text-decoration:none;color:inherit}
.wrap{width:min(1120px,calc(100% - 32px));margin:auto}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.topbar{height:68px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:26px;font-weight:800;letter-spacing:-.8px;color:#23272f}.brand strong{color:var(--orange)}
.back-home{font-size:13px;color:#687385}.back-home:hover{color:var(--orange)}

.search-strip{background:#fff;border-bottom:1px solid var(--line);padding:16px 0}
.search{display:grid;grid-template-columns:1.2fr 1fr auto;gap:10px}
.search input{height:50px;padding:0 14px;border:1px solid #d8dce3;border-radius:9px;font-size:15px;outline:0}
.search input:focus{border-color:#f0a36c;box-shadow:0 0 0 3px rgba(244,122,31,.08)}
.search button{border:0;border-radius:9px;background:var(--orange);color:white;font-weight:800;padding:0 24px;font-size:15px;cursor:pointer}
.search button:hover{background:var(--orange-dark)}

main{padding:30px 0 50px}
.headline{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:20px}
.title{font-size:28px;font-weight:800;letter-spacing:-.6px;margin:0 0 5px}
.count{color:var(--muted);font-size:14px}
.source-note{font-size:12px;color:#98a2b3}

.job{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:22px;
  margin-bottom:14px;
  transition:.18s ease;
}
.job:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(16,24,40,.07);border-color:#d8dce3}
.job-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
.job h2{font-size:20px;line-height:1.3;margin:0 0 7px;color:#273142}
.company{font-weight:700;font-size:14px;color:#475467;margin-bottom:12px}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;color:#667085;font-size:13px;margin-bottom:13px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:#f5f6f8}
.desc{font-size:14px;line-height:1.58;color:#596273;max-width:900px}
.apply{
  display:inline-flex;align-items:center;justify-content:center;
  margin-top:16px;padding:9px 13px;border-radius:8px;
  color:#fff;background:var(--orange);font-weight:800;font-size:13px
}
.apply:hover{background:var(--orange-dark)}
.notice{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px;text-align:center;color:#777}
.pager{display:flex;gap:8px;justify-content:center;margin-top:24px}
.pager a{padding:9px 14px;background:#fff;border:1px solid var(--line);text-decoration:none;color:#555;border-radius:8px}
.pager a:hover{border-color:#f0a36c;color:var(--orange)}
footer{background:#fff;border-top:1px solid var(--line);padding:24px 0;color:#8a93a3;font-size:13px;text-align:center}

@media(max-width:720px){
  .search{grid-template-columns:1fr}
  .search button{height:50px}
  .headline{display:block}
  .source-note{margin-top:8px}
  .job{padding:18px}
}
</style>
</head>
<body>
<header>
  <div class="wrap topbar">
    <a class="brand" href="/">Jobs<strong>Other</strong></a>
    <a class="back-home" href="/">← Back to home</a>
  </div>
</header>

<div class="search-strip">
  <div class="wrap">
    <form class="search" id="search">
      <input id="q" placeholder="Job title or keywords">
      <input id="loc" placeholder="City, province or postcode">
      <button>Search Jobs</button>
    </form>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="headline">
      <div>
        <h1 class="title" id="heading">Job Search Results</h1>
        <div class="count" id="count">Loading jobs...</div>
      </div>
      <div class="source-note">Listings may redirect to the original job source.</div>
    </div>

    <div id="results"><div class="notice">Loading jobs...</div></div>
    <div class="pager" id="pager"></div>
  </div>
</main>

<footer>© 2026 JobsOther. All rights reserved.</footer>

<script>
const params=new URLSearchParams(location.search);
const q=params.get('q')||'';
const loc=params.get('location')||'';
const page=Math.max(1,parseInt(params.get('page')||'1',10));
const qv=document.getElementById('q');
const lv=document.getElementById('loc');
qv.value=q;lv.value=loc;
document.getElementById('heading').textContent=(q?q+' jobs':'Jobs')+(loc?' in '+loc:'');

document.getElementById('search').addEventListener('submit',e=>{
  e.preventDefault();
  const p=new URLSearchParams();
  if(qv.value.trim())p.set('q',qv.value.trim());
  if(lv.value.trim())p.set('location',lv.value.trim());
  location.href='/jobs.html?'+p;
});

function esc(value){
  return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function stripHtml(value){
  const d=document.createElement('div');
  d.innerHTML=String(value||'');
  return d.textContent||d.innerText||'';
}
function salary(job){
  if(job.salary_min==null && job.salary_max==null) return '';
  const fmt=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0}).format(n);
  if(job.salary_min!=null && job.salary_max!=null) return fmt(job.salary_min)+' – '+fmt(job.salary_max);
  return fmt(job.salary_min ?? job.salary_max);
}
function pageUrl(n){
  const p=new URLSearchParams();
  if(q)p.set('q',q);
  if(loc)p.set('location',loc);
  p.set('page',String(n));
  return '/jobs.html?'+p.toString();
}

async function load(){
  const api=new URLSearchParams({page:String(page),results_per_page:'20'});
  if(q)api.set('q',q);
  if(loc)api.set('location',loc);

  try{
    const r=await fetch('/api/jobs.php?'+api.toString());
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||'Unable to load jobs');

    document.getElementById('count').textContent=
      new Intl.NumberFormat('en-CA').format(data.count||0)+' jobs found';

    if(!data.results?.length){
      document.getElementById('results').innerHTML='<div class="notice">No jobs found. Try a different keyword or location.</div>';
      return;
    }

    document.getElementById('results').innerHTML=data.results.map(job=>{
      const desc=stripHtml(job.description).slice(0,320);
      const pay=salary(job);
      const type=[job.contract_time,job.contract_type].filter(Boolean).join(' · ');
      const meta=[];
      if(job.location) meta.push('<span class="badge">📍 '+esc(job.location)+'</span>');
      if(pay) meta.push('<span class="badge">💵 '+esc(pay)+'</span>');
      if(type) meta.push('<span class="badge">🕒 '+esc(type)+'</span>');
      if(job.category) meta.push('<span class="badge">▦ '+esc(job.category)+'</span>');

      return '<article class="job">'+
        '<div class="job-top"><div>'+
          '<h2>'+esc(job.title)+'</h2>'+
          (job.company?'<div class="company">'+esc(job.company)+'</div>':'')+
        '</div></div>'+
        '<div class="meta">'+meta.join('')+'</div>'+
        '<div class="desc">'+esc(desc)+(desc.length>=320?'…':'')+'</div>'+
        (job.redirect_url?'<a class="apply" href="'+esc(job.redirect_url)+'" target="_blank" rel="noopener sponsored">View Job ↗</a>':'')+
      '</article>';
    }).join('');

    const pager=[];
    if(page>1)pager.push('<a href="'+pageUrl(page-1)+'">← Previous</a>');
    if((data.results||[]).length===20)pager.push('<a href="'+pageUrl(page+1)+'">Next →</a>');
    document.getElementById('pager').innerHTML=pager.join('');
  }catch(err){
    document.getElementById('count').textContent='';
    document.getElementById('results').innerHTML='<div class="notice"><strong>Jobs could not be loaded.</strong><br><br>'+esc(err.message)+'</div>';
  }
}
load();
</script>
</body>
</html>
